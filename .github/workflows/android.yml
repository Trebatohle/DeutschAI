name: Android build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Configure stable release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "RELEASE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            {
              echo "### Update-ready APK"
              echo ""
              echo "Stable signing is not configured. The debug APK is for testing and may not install as an update over APKs from a different CI run."
              echo "Add the four Android signing secrets to enable the update-ready release APK."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          mkdir -p "$RUNNER_TEMP/deutschai-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deutschai-signing/deutschai-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/deutschai-signing/deutschai-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"

      - name: Run content quality tests
        run: gradle testDebugUnitTest -PversionCode="${GITHUB_RUN_NUMBER}" -PversionName="1.0.${GITHUB_RUN_NUMBER}"

      - name: Build debug APK
        run: gradle assembleDebug -PversionCode="${GITHUB_RUN_NUMBER}" -PversionName="1.0.${GITHUB_RUN_NUMBER}"

      - name: Build stable-signed release APK
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease -PversionCode="${GITHUB_RUN_NUMBER}" -PversionName="1.0.${GITHUB_RUN_NUMBER}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: deutschai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload update-ready release APK
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deutschai-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
